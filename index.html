      // 在页面绘制前恢复主题，避免刷新时闪烁；存储不可用也能正常浏览。

        const savedTheme = localStorage.getItem('yzx-profile-theme');
        if (savedTheme === 'light') document.documentElement.dataset.theme = 'light';
      } catch {}
